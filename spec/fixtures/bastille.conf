# Minimal Bastille config used only by the shellspec unit suite.
# It exists so that `. ${BASTILLE_CONFIG}` (run at the top of every
# usr/local/share/bastille/*.sh file) succeeds when sourcing a module in
# isolation. Values are inert placeholders -- unit specs never touch a real
# jail tree, ZFS dataset, or network interface.

bastille_prefix="/usr/local/bastille"
bastille_jailsdir="${bastille_prefix}/jails"
bastille_logsdir="${bastille_prefix}/logs"
bastille_templatesdir="${bastille_prefix}/templates"

bastille_zfs_enable="NO"
bastille_zfs_zpool=""

## Networking
bastille_network_vnet_type="if_bridge"
bastille_network_loopback=""
bastille_network_shared=""
