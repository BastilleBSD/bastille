server:
    # localhost (for host resolving)
    interface: 127.0.0.1
    # bastille_dns_network (excluding netmask)
    interface: 10.0.0.1

    access-control: 127.0.0.1/8 allow
    access-control: 10.0.0.0/8 allow

    # Remove the following line to force DNSSEC validation
    module-config: "iterator"